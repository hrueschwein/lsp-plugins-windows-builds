name: Build LSP Plugins (Windows VST3 UI)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Clone LSP Plugins
        shell: pwsh
        run: |
          git clone https://github.com/lsp-plugins/lsp-plugins.git lsp-plugins

      - name: Initialize submodules
        shell: pwsh
        working-directory: lsp-plugins
        run: |
          git submodule update --init --recursive

      - name: Clone VST3 SDK
        shell: pwsh
        run: |
          git clone --recursive --depth 1 https://github.com/steinbergmedia/vst3sdk.git vst3sdk

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-fontconfig
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libxslt
            mingw-w64-x86_64-harfbuzz

      - name: Configure and Build
        shell: msys2 {0}
        working-directory: lsp-plugins
        run: |
          # Преобразуем $GITHUB_WORKSPACE из "D:\a\..." в "D:/a/..." для совместимости с bash
          VST3_SDK_DIR="${GITHUB_WORKSPACE//\\//}/vst3sdk"
          export VST3_SDK_DIR
          make config FEATURES='vst3 ui' PREFIX=/usr
          make -j$(nproc)

      - name: Install
        shell: msys2 {0}
        working-directory: lsp-plugins
        run: |
          make install DESTDIR="${{ github.workspace }}/install"

      - name: Prepare artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path install/* -DestinationPath lsp-plugins-windows-vst3-ui.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lsp-plugins-windows-vst3-ui
          path: lsp-plugins-windows-vst3-ui.zip
